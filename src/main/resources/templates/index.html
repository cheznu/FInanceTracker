<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Tracker</title>
</head>
<body>
<h1 th:text="${message}"></h1>

<h2>Recent Transactions</h2>
<ul>
    <li th:each="t : ${transactions}">
        <span th:text="${t.transactionName}">Name</span> -
        <strong th:text="${#numbers.formatCurrency(t.transactionAmount)}">$0.00</strong>
    </li>
</ul>
</body>
</html>
