<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <title>My Finance Tracker</title>
</head>
<body>
<h1>Transactions</h1>

<table border="1">
    <thead>
    <tr>
        <th>Description</th>
        <th>Amount</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${transactions}">
        <td th:text="${t.transactionName}">Placeholder Name</td>
        <td th:text="${t.transactionAmount}">0.00</td>
    </tr>
    </tbody>
</table>
</body>
</html>
